<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffcf5" />
    <script>
      (() => {
        let saved
        try { saved = localStorage.getItem('portfolio-theme') } catch { /* Use the system preference. */ }
        const theme = saved === 'dark' || saved === 'light' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101b17' : '#fffcf5'
      })()
    </script>
    <meta name="description" content="Portfólio de Abner Almeida, estudante de Engenharia de Software na PUC Minas. Projetos, habilidades e trajetória em desenvolvimento web." />
    <title>Abner Almeida | Portfólio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
